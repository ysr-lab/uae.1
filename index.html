
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAE National Day Greeting</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  text-align: center;
  color: #222;
}

.container {
  max-width: 450px;
  margin: auto;
}

h2 {
  margin-bottom: 8px;
}

p {
  color: #666;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 17px;
  margin: 12px 0;
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: none;
  border-radius: 8px;
  background: #08734b;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

canvas {
  width: 100%;
  height: auto;
  margin-top: 15px;
  border-radius: 8px;
}

#status {
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

<h2>UAE National Day Greeting</h2>
<p>Enter your name to personalize your greeting card</p>

<input
  id="employeeName"
  type="text"
  placeholder="اكتب اسمك / Enter your name"
>

<button onclick="generateCard()">
  Generate Greeting
</button>

<canvas id="card" width="1080" height="1920"></canvas>

<button id="downloadButton" onclick="downloadCard()" disabled>
  Download PNG
</button>

<p id="status">Your greeting card will appear here.</p>

</div>

<script>
const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");
const img = new Image();

let imageReady = false;
let generated = false;

img.onload = function() {
  imageReady = true;
  ctx.drawImage(img, 0, 0, 1080, 1920);
  document.getElementById("status").textContent =
    "Your card is ready. Enter your name.";
};

img.onerror = function() {
  document.getElementById("status").textContent =
    "Card image not found. Please upload uae-card.png.";
};

img.src = "UAE National Day Greeting Card.png";

function generateCard() {
  const name = document.getElementById("employeeName").value.trim();

  if (!imageReady) {
    alert("Please wait for the card image to load.");
    return;
  }

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  ctx.clearRect(0, 0, 1080, 1920);
  ctx.drawImage(img, 0, 0, 1080, 1920);

  ctx.save();

  ctx.font = "bold 48px Arial";
  ctx.fillStyle = "#316880";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(name, 540, 1730);

  ctx.restore();

  generated = true;
  document.getElementById("downloadButton").disabled = false;
  document.getElementById("status").textContent =
    "Your greeting card is ready to download!";
}

function downloadCard() {
  if (!generated) {
    generateCard();
  }

  if (!generated) return;

  const link = document.createElement("a");
  link.download = "UAE-National-Day-Greeting.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
