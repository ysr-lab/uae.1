<script>
const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");
const img = new Image();

let imageReady = false;
let generated = false;

// NAME POSITION SETTINGS (center of the box)
const NAME_X = 540;
const NAME_Y = 1655;

// NAME STYLE
const NAME_COLOR = "#316880";
const MAX_FONT_SIZE = 64;
const MIN_FONT_SIZE = 24;
const MAX_NAME_WIDTH = 540;
const FONT_FAMILY = "Tahoma, Arial, sans-serif";

img.onload = function () {
  imageReady = true;
  drawOriginalCard();
  document.getElementById("status").textContent =
    "Your card is ready. Enter your name.";
};

img.onerror = function () {
  document.getElementById("status").textContent =
    "Image not found. Please check the image filename.";
};

// تأكد أن اسم الملف في GitHub مطابق تماماً
img.src = "UAE_National_Day_Greeting_Card.png";

function drawOriginalCard() {
  ctx.clearRect(0, 0, 1080, 1920);
  ctx.drawImage(img, 0, 0, 1080, 1920);
}

function generateCard() {
  const name = document.getElementById("employeeName").value.trim();

  if (!imageReady) {
    alert("Please wait for the card image to load.");
    return;
  }
  if (!name) {
    alert("Please enter your name.");
    return;
  }

  drawOriginalCard();
  ctx.save();

  let size = MAX_FONT_SIZE;
  ctx.direction = "auto";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = NAME_COLOR;
  ctx.font = `bold ${size}px ${FONT_FAMILY}`;

  while (ctx.measureText(name).width > MAX_NAME_WIDTH && size > MIN_FONT_SIZE) {
    size -= 2;
    ctx.font = `bold ${size}px ${FONT_FAMILY}`;
  }

  ctx.fillText(name, NAME_X, NAME_Y);
  ctx.restore();

  generated = true;
  document.getElementById("downloadButton").disabled = false;
  document.getElementById("status").textContent =
    "Your greeting card is ready to download!";
}

function downloadCard() {
  if (!generated) generateCard();
  if (!generated) return;

  const link = document.createElement("a");
  link.download = "UAE-National-Day-Greeting.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>
